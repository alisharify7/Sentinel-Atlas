<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title description">
<title id="title">A centered master, with room for every replica</title>
<desc id="description">Illustration using sample data: one Redis master at the center of six replicas, directional replication links, and fit and zoom controls. The built-in demo contains three instances.</desc>
<defs>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#334765"/></pattern>
  <linearGradient id="replica" x2="1" y2="1"><stop stop-color="#1e314c"/><stop offset="1" stop-color="#17283f"/></linearGradient>
  <linearGradient id="master" x2="1" y2="1"><stop stop-color="#17433f"/><stop offset="1" stop-color="#172e36"/></linearGradient>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#71a8df"/></marker>
</defs>
