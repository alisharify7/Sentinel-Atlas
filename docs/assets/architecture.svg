</symbol><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f8faef"/><stop offset="1" stop-color="#e6eddb"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#c5d2b7"/></pattern></defs><rect x="0" y="0" width="1400" height="580" rx="20" fill="#f7f9f2" stroke="none"/><text x="55" y="61" fill="#2d4535" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start" >Choose how you connect.</text><text x="55" y="94" fill="#8a9b78" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" >One dashboard. Direct Redis access or optional server probes.</text><rect x="55" y="144" width="270" height="288" rx="14" fill="#fff" stroke="#dfe7d6"/><use href="#owl" x="151" y="160" width="78" height="78"/><text x="190" y="267" fill="#365339" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" >Sentinel Atlas</text><text x="190" y="298" fill="#8a9e78" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" >Login · cached observations</text><text x="190" y="321" fill="#8a9e78" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" >Topology · events · log viewer</text><rect x="83" y="356" width="214" height="47" rx="8" fill="#eef4e6" stroke="none"/><text x="190" y="385" fill="#6e8858" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" text-anchor="middle" >SQLite / PostgreSQL</text><path d="M325 223H465M325 360H465" fill="none" stroke="#9db28d" stroke-width="2"/><path d="m455 218 10 5-10 5m0 127 10 5-10 5" fill="none" stroke="#9db28d" stroke-width="2"/><rect x="465" y="144" width="402" height="132" rx="12" fill="#edf5e8" stroke="#d0dfc4"/><text x="489" y="177" fill="#7d9666" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">DIRECT CONNECTION</text><text x="489" y="210" fill="#3e5b3b" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" text-anchor="start" >Redis / Sentinel protocol</text><text x="489" y="245" fill="#819873" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" >Metrics · roles · replication · quorum</text><rect x="465" y="304" width="402" height="128" rx="12" fill="#f5efdf" stroke="#e3d8bb"/><text x="489" y="337" fill="#a58c55" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">OPTIONAL ANSIBLE PROBE</text><text x="489" y="370" fill="#77653d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" text-anchor="start" >SSH to Linux servers</text><text x="489" y="405" fill="#a19066" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" >Adds hardware · storage · service logs</text><path d="M867 208H980M867 365H980" fill="none" stroke="#9db28d" stroke-width="2"/><path d="m970 203 10 5-10 5m0 152 10 5-10 5" fill="none" stroke="#9db28d" stroke-width="2"/><rect x="980" y="144" width="365" height="132" rx="12" fill="#fff" stroke="#dfe7d6"/><text x="1007" y="181" fill="#4c6945" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="start" >Anywhere Redis is reachable</text><text x="1007" y="215" fill="#8a9e78" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" >Standalone · replication · Sentinel</text><text x="1007" y="248" fill="#8a9e78" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" >TLS + ACL authentication supported</text><rect x="980" y="304" width="365" height="128" rx="12" fill="#fff" stroke="#dfe7d6"/><text x="1007" y="342" fill="#4c6945" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="start" >Native hosts or nspawn</text><text x="1007" y="377" fill="#8a9e78" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" >Use your existing Ansible inventory</text><text x="1007" y="408" fill="#8a9e78" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" >Read-only probes; no package installation</text><text x="55" y="494" fill="#80966d" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1.5">PERSISTED</text><text x="55" y="522" fill="#6d855b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" >Accounts, sessions, and login throttles</text><text x="720" y="494" fill="#80966d" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1.5">KEPT IN MEMORY</text><text x="720" y="522" fill="#6d855b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" >Recent metrics, bounded log tails, and session events</text></svg>