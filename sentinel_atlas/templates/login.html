{% extends 'auth_base.html' %}{% block title %}Sign in · Sentinel Atlas{% endblock %}{% block content %}<div class="section-eyebrow">WELCOME BACK</div><h2>Sign in to your watchtower.</h2><p class="auth-description">Use your workspace account to continue.</p>{% if error %}<div class="auth-message error" role="alert">{{ error }}</div>{% endif %}<form method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Account name<input name="username" autocomplete="username" maxlength="80" required autofocus></label><label>Password<input type="password" name="password" autocomplete="current-password" maxlength="256" required></label><button class="auth-primary" type="submit">Sign in <span>→</span></button></form><p class="auth-hint">Need access? Ask your workspace administrator.</p>{% endblock %}
