  <section class="panel logs-panel" id="logs" aria-label="Live service logs">
   <div class="panel-heading"><div><div class="section-eyebrow">SERVICE CONSOLE</div><h2>Live logs</h2><p class="panel-description">Redis and Sentinel output from your selected instance.</p></div><div class="logs-instance"><label for="logNode">INSTANCE</label><select id="logNode" aria-label="Log instance"><option value="">Waiting for instances</option></select></div></div>
   <div class="log-toolbar"><div class="log-service-tabs" role="group" aria-label="Log service"><button data-log-service="redis" class="active" aria-pressed="true">Redis<span>6379</span></button><button data-log-service="sentinel" aria-pressed="false">Sentinel<span>26379</span></button></div><div class="log-actions"><input type="search" id="logFilter" placeholder="Filter log lines…" aria-label="Filter log lines"><button class="button" id="logPause" aria-pressed="false">Pause</button><button class="button" id="logFollow" aria-pressed="true">Following ↓</button></div></div>
