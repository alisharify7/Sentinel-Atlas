{% extends 'auth_base.html' %}{% block title %}Your account · Sentinel Atlas{% endblock %}{% block content %}<div class="section-eyebrow">YOUR ACCOUNT · {{ g.user.username }}</div><h2>Keep your account yours.</h2><p class="auth-description">Changing your password signs out all your sessions.</p><form method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Current password<input type="password" name="current_password" autocomplete="current-password" required></label><label>New password<input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="256" required></label><button class="auth-primary">Change password</button></form><a class="auth-back" href="{{ url_for('index') }}">← Back to dashboard</a>{% endblock %}
